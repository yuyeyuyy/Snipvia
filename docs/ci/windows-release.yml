name: Windows release validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Install dependencies
        run: |
          npm install --global pnpm@11.1.3
          pnpm install --frozen-lockfile
      - name: Check Windows contracts and adapters
        run: pnpm exec vitest run tests/unit/geometry.test.ts tests/unit/thumbnail-size.test.ts tests/unit/desktop-source-selection.test.ts tests/unit/login-item.test.ts tests/unit/screenshot-chat-access.test.ts tests/unit/providers.test.ts tests/unit/account.test.ts tests/unit/screenshot-editor.test.ts
      - name: Build desktop
        run: pnpm build
      - name: Validate account, providers, notes and screenshot access
        run: pnpm exec playwright test tests/integration/account.spec.ts tests/integration/provider-settings.spec.ts tests/integration/notes-markdown.spec.ts tests/integration/screenshot-membership.spec.ts tests/integration/screenshot-editor.spec.ts
      - name: Build EXE installer
        run: pnpm exec electron-builder --win nsis --x64 --publish never
      - name: Install into a temporary directory
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = Resolve-Path "dist/Snipvia-Setup-$version-x64.exe"
          $installDir = Join-Path $env:RUNNER_TEMP 'Snipvia-install-validation'
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $binary = Join-Path $installDir 'Snipvia.exe'
          if (!(Test-Path $binary)) { throw 'Installed application missing' }
          "SNIPVIA_TEST_APP_BINARY=$binary" >> $env:GITHUB_ENV
      - name: Validate installed Windows application
        run: pnpm exec playwright test tests/integration/windows-release.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-release-validation
          path: |
            dist/Snipvia-Setup-*.exe
            test-results/
          retention-days: 14
