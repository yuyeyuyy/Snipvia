appId: com.snipvia.desktop
productName: Snipvia
directories:
  output: dist
toolsets:
  nsis: '1.2.1'
files:
  - out/**/*
  - package.json
  - LICENSE
  - NOTICE
  - THIRD_PARTY_NOTICES.md
mac:
  category: public.app-category.productivity
  minimumSystemVersion: '14.0'
  icon: UI/Snipvia-2-mac.icon
  extraResources:
    - from: build/native/snipvia-capture-helper
      to: native/snipvia-capture-helper
    - from: build/TrayTemplate.png
      to: TrayTemplate.png
    - from: build/TrayTemplate@2x.png
      to: TrayTemplate@2x.png
  identity: '-'
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  binaries:
    - Contents/Resources/native/snipvia-capture-helper
  extendInfo:
    CFBundleDisplayName: '截然'
    NSScreenCaptureUsageDescription: '截然需要录制你框选的屏幕区域，以生成截图并执行你选择的操作。'
    NSAppleEventsUsageDescription: '选择目标日历或提醒事项列表时读取可写位置；你确认添加后，截然才会控制“日历”或“提醒事项”写入所选内容。'
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
win:
  artifactName: 'Snipvia-Setup-${version}-${arch}.${ext}'
  icon: UI/Snipvia-Win.ico
  extraResources:
    - from: UI/Snipvia-Win.ico
      to: Snipvia.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
