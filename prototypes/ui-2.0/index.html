<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>Snipvia UI 2.0 · 设计原型</title>
    <link rel="icon" href="assets/app-icon.png">
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="prototype.css">
  </head>
  <body>
    <header class="review-toolbar" aria-label="原型演示工具栏">
      <div class="review-brand"><strong>Snipvia <span>2.0</span></strong><small>阶段 1 / 交互原型</small></div>
      <label>方案<select id="layout-picker" aria-label="主窗口布局"><option value="a">A · 紧凑导航（推荐）</option><option value="b">B · 顶部工作台</option></select></label>
      <label>页面<select id="page-picker" aria-label="原型页面"><option value="notes">AI 笔记</option><option value="schedule">截图日程</option><option value="history">历史对话</option><option value="capture">截图 AI 浮窗</option><option value="settings">设置</option></select></label>
      <label>外观<select id="theme-picker" aria-label="主题"><option value="light">Light</option><option value="dark">Dark</option><option value="system">System</option></select></label>
      <label>状态<select id="state-picker" aria-label="演示状态"><option value="ready">正常</option><option value="empty">空内容</option><option value="loading">加载中</option><option value="error">失败 / 重试</option><option value="permission">等待确认</option><option value="no-access">无会员资格</option></select></label>
      <span class="prototype-label">合成数据 · 无联网调用</span>
    </header>
    <main id="prototype-root" aria-label="Snipvia 设计预览"></main>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <dialog id="design-dialog" aria-label="快捷操作"></dialog>
    <script src="app.js" type="module"></script>
  </body>
</html>
