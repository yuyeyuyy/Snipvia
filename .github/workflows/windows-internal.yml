name: Windows internal build and synthetic desktop checks

on:
  workflow_dispatch:
    inputs:
      upload_internal_artifacts:
        description: Upload unsigned internal installer (requires owner approval)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Install pinned dependencies
        run: |
          npm install --global pnpm@11.1.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm electron:install
      - name: Lint and typecheck
        run: |
          pnpm lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm typecheck
      - name: Check current capture, collection, IPC, storage and platform adapters
        run: pnpm test
      - name: Build and inspect unsigned NSIS installer
        run: pnpm dist:windows
      - name: Validate current synthetic desktop flows
        run: pnpm exec playwright test tests/integration/v2-settings.spec.ts tests/integration/appearance.spec.ts tests/integration/feedback.spec.ts tests/integration/screenshot-editor.spec.ts tests/integration/capture-window-visibility.spec.ts tests/integration/windows-capture-ui.spec.ts tests/integration/v2-continuous.spec.ts
      # These tests launch the development build. Installed-app, real display,
      # mixed-DPI and install/uninstall validation require a separate real run.
      - name: Upload internal artifacts only when explicitly enabled
        uses: actions/upload-artifact@v4
        if: inputs.upload_internal_artifacts
        with:
          name: windows-unsigned-internal
          path: |
            dist/windows-internal/internal-*/*.exe
            dist/windows-internal/internal-*/BUILD_METADATA.json
            dist/windows-internal/internal-*/SHA256SUMS.txt
            test-results/
          retention-days: 7
